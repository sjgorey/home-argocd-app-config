apiVersion: v1
kind: Secret
metadata:
  name: searxng
  namespace: searxng
  labels:
    app: searxng
type: Opaque
stringData:
  settings.yml: |
    use_default_settings: true
    server:
      limiter: false
      image_proxy: false
      secret_key: "fb126e35af4997741f7e98a07ff03cec5bea340996a47790bd4d1d5b9902ec29"
    search:
      safe_search: 0
      autocomplete: ""
      default_lang: "en"
      formats:
        - html
        - json
    engines:
      # Wikidata SPARQL init can block workers for ~60s and fail probes.
      - name: wikidata
        disabled: true
      # These reject this network with CAPTCHA, rate limits, or parse errors.
      - name: google
        disabled: true
      - name: duckduckgo
        disabled: true
      - name: qwant
        disabled: true
      - name: brave
        disabled: true
      - name: bing
        disabled: false
  uwsgi.ini: |
    [uwsgi]
    workers = 2
    threads = 2
    single-interpreter = true
    master = true
    plugin = python3
    lazy-apps = true
    enable-threads = 2
    module = searx.webapp
    pythonpath = /usr/local/searxng/
    chdir = /usr/local/searxng/searx/
    auto-procname = true
    disable-logging = true
    log-5xx = true
    buffer-size = 8192
    add-header = Connection: close
    die-on-term
    static-map = /static=/usr/local/searxng/searx/static
    static-expires = /* 86400
    static-gzip-all = True
    offload-threads = 2
    http = 0.0.0.0:8080
